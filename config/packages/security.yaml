security:
    # Hachage des mots de passe (algorithme choisi automatiquement par Symfony)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Hiérarchie des rôles : un SUPER_ADMIN a tous les droits d'un ADMIN,
    # et un ADMIN a tous les droits d'un USER
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    # L'utilisateur est rechargé depuis la base à partir de son email
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Connexion par formulaire (email + mot de passe)
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                enable_csrf: true
            # Déconnexion : retour à l'accueil
            logout:
                path: app_logout
                target: app_home

    # La première règle qui correspond est appliquée
    access_control:
        - { path: ^/compte, roles: ROLE_USER }
        - { path: ^/panier, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/super-admin, roles: ROLE_SUPER_ADMIN }

when@test:
    security:
        password_hashers:
            # Hachage volontairement rapide pendant les tests
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
